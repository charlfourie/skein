name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    name: Editor (type-check, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  runtimes:
    name: Runtimes (conformance)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      # The committed fixtures must match what the reference runtime does now.
      - run: npx tsx runtimes/conformance/generate.ts --check
      # Every port must reproduce them exactly.
      - name: C# runtime
        run: dotnet run --project runtimes/csharp/tests
